<script>
  // KaTeX loads in the background; the app works without it (math then shows as TeX source)
  (function () {
    var base = 'https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/';
    var a = document.createElement('script'); a.src = base + 'katex.min.js'; a.crossOrigin = 'anonymous'; a.async = true;
    a.onload = function () {
      var b = document.createElement('script'); b.src = base + 'contrib/auto-render.min.js'; b.crossOrigin = 'anonymous'; b.async = true;
      b.onload = function () { window.dispatchEvent(new Event('katex-ready')); };
      document.head.appendChild(b);
    };
    document.head.appendChild(a);
  })();
</script>
